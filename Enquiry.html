<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | Monster Wash Kings</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>Monster Wash Kings</h1>
            <p>Mobile Car Wash Services</p>
        </div>
    </header>


    <nav class="main-nav">
        <div class="container nav-container">
            <a href="Index.html">Home</a>
            <a href="About.html">About Us</a>
            <a href="Services.html">Services</a>
            <a href="Enquiry.html">Enquiry</a>
            <a href="Contact.html">Contact</a>
        </div>
    </nav>


    <main>

        <section class="page-intro">
            <div class="container">

                <h2>Book a Car Wash</h2>

                <p>
                    Ready to get your vehicle cleaned?
                    Complete the form below and send us your enquiry.
                </p>

            </div>
        </section>


        <section class="enquiry-section">
            <div class="container">

                <div class="form-container">

                    <h2>Service Enquiry Form</h2>

                    <form>

                        <div class="form-group">
                            <label for="name">Full Name:</label>
                            <input type="text" id="name" name="name" required>
                        </div>


                        <div class="form-group">
                            <label for="email">Email Address:</label>
                            <input type="email" id="email" name="email" required>
                        </div>


                        <div class="form-group">
                            <label for="phone">Phone Number:</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>


                        <div class="form-group">
                            <label for="service">Select a Service:</label>

                            <select id="service" name="service" required>
                                <option value="">-- Select a Service --</option>
                                <option value="basic">Basic Car Wash - R150</option>
                                <option value="full">Full Car Wash - R200</option>
                                <option value="interior">Interior Cleaning - R100</option>
                                <option value="exterior">Exterior Cleaning - R100</option>
                            </select>
                        </div>


                        <div class="form-group">
                            <label for="date">Preferred Date:</label>
                            <input type="date" id="date" name="date" required>
                        </div>


                        <div class="form-group">
                            <label for="time">Preferred Time:</label>
                            <input type="time" id="time" name="time" required>
                        </div>


                        <div class="form-group">
                            <label for="location">Service Location:</label>
                            <input type="text" id="location" name="location"
                                placeholder="Enter your suburb or area" required>
                        </div>


                        <div class="form-group">
                            <label for="message">Additional Information:</label>

                            <textarea id="message" name="message" rows="5"
                                placeholder="Tell us anything we should know about your vehicle or booking."></textarea>
                        </div>


                        <button type="submit">Submit Enquiry</button>

                    </form>

                </div>

            </div>
        </section>

    </main>


    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Monster Wash Kings. All Rights Reserved.</p>
        </div>
    </footer>

</body>

</html>
