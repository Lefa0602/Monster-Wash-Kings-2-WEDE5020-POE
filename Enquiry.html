<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Mobile Car Wash | Monster Wash Kings</title>
    <meta name="description" content="Enquire about a mobile car wash with Monster Wash Kings. Select your preferred service, date and location in Pretoria North.">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>Monster Wash Kings</h1>
            <p>Mobile Car Wash Services</p>
        </div>
    </header>


    <nav class="main-nav">
        <div class="container nav-container">
            <a href="Index.html">Home</a>
            <a href="About.html">About Us</a>
            <a href="Services.html">Services</a>
            <a href="Enquiry.html">Enquiry</a>
            <a href="Contact.html">Contact</a>
        </div>
    </nav>


    <main>

        <section class="page-intro">
            <div class="container">

                <h1>Book a Car Wash</h1>
                <p>
                    Ready to get your vehicle cleaned?
                    Complete the form below and send us your enquiry.
                </p>

            </div>
        </section>


        <section class="enquiry-section">
            <div class="container">

                <div class="form-container">

                    <h2>Service Enquiry Form</h2>

                   

<form id="enquiry-form"
      action="https://formsubmit.app/f/neavabdbeg"
      method="POST">
    <input type="hidden" name="_subject"
           value="New Monster Wash Kings Booking Enquiry">

    <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               minlength="2" maxlength="80" required>
    </div>

    <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               maxlength="120" required>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               pattern="[+]?[0-9 ()-]{9,20}"
               title="Enter a valid phone number using digits, spaces, brackets or hyphens."
               required>
    </div>

    <div class="form-group">
        <label for="service">Select a Service:</label>
        <select id="service" name="service" required>
            <option value="">-- Select a Service --</option>
            <option value="Basic Car Wash - R150">Basic Car Wash - R150</option>
            <option value="Full Car Wash - R200">Full Car Wash - R200</option>
            <option value="Interior Cleaning - R100">Interior Cleaning - R100</option>
            <option value="Exterior Cleaning - R100">Exterior Cleaning - R100</option>
        </select>
    </div>

    <div class="form-group">
        <label for="date">Preferred Date:</label>
        <input type="date" id="date" name="date" required>
    </div>

    <div class="form-group">
        <label for="time">Preferred Time:</label>
        <input type="time" id="time" name="time" required>
    </div>

    <div class="form-group">
        <label for="location">Service Location:</label>
        <input type="text" id="location" name="location"
               placeholder="Enter your suburb or area"
               minlength="2" maxlength="150" required>
    </div>

    <div class="form-group">
        <label for="message">Additional Information:</label>
        <textarea id="message" name="message" rows="5"
                  maxlength="1000"
                  placeholder="Tell us anything we should know about your vehicle or booking."></textarea>
    </div>

    <button type="submit">Submit Enquiry</button>
    <p id="enquiry-feedback" role="status" aria-live="polite"></p>
</form>

                </div>

            </div>
        </section>

    </main>


    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Monster Wash Kings. All Rights Reserved.</p>
        </div>
    </footer>
<script src="js/script.js"></script>
</body>

</html>
