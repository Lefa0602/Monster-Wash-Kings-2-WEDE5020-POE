<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | Monster Wash Kings</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Monster Wash Kings</h1>
        <p>Mobile Car Wash Services</p>
    </header>


    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>


    <!-- Main Content -->
    <main>

        <!-- Enquiry Introduction -->
        <section>
            <h2>Book a Car Wash</h2>

            <p>
                Ready to get your vehicle cleaned?
                Complete the form below and send us your enquiry.
            </p>
        </section>


        <!-- Booking Form -->
        <section>

            <h2>Service Enquiry Form</h2>

            <form>

                <!-- Customer Name -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>


                <!-- Email -->
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <br><br>


                <!-- Phone -->
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <br><br>


                <!-- Service Selection -->
                <label for="service">Select a Service:</label>

                <select id="service" name="service" required>

                    <option value="">-- Select a Service --</option>

                    <option value="basic">
                        Basic Car Wash - R150
                    </option>

                    <option value="full">
                        Full Car Wash - R200
                    </option>

                    <option value="interior">
                        Interior Cleaning - R100
                    </option>

                    <option value="exterior">
                        Exterior Cleaning - R100
                    </option>

                </select>

                <br><br>


                <!-- Preferred Date -->
                <label for="date">Preferred Date:</label>
                <input type="date" id="date" name="date" required>

                <br><br>


                <!-- Preferred Time -->
                <label for="time">Preferred Time:</label>
                <input type="time" id="time" name="time" required>

                <br><br>


                <!-- Location -->
                <label for="location">Service Location:</label>
                <input type="text" id="location" name="location"
                    placeholder="Enter your suburb or area" required>

                <br><br>


                <!-- Additional Message -->
                <label for="message">Additional Information:</label>

                <br>

                <textarea id="message" name="message" rows="5" cols="30"
                    placeholder="Tell us anything we should know about your vehicle or booking."></textarea>

                <br><br>


                <!-- Submit -->
                <button type="submit">Submit Enquiry</button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Monster Wash Kings. All Rights Reserved.</p>
    </footer>

</body>

</html>
